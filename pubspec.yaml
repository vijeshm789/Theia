name: theia
description: "Theia - Gold & Silver Intelligence App. Real-time precious metal prices, historical trends, AI-driven forecasts, and market news."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/theia_logo.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/theia_logo.png"
  web:
    generate: true
    image_path: "assets/images/theia_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
